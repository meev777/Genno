services:
  genno:
    build: {context: .., dockerfile: deploy/Dockerfile}
    ports: ["2222:2222"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    networks: [honeynet]
    volumes: ["../data:/data"]
    tmpfs: ["/tmp"]
networks:
  honeynet:
    ipam:
      config:
        - subnet: 172.30.50.0/24     # pinned so nftables.rules always matches
